	<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: assets/bananatarget.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
	<img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
	<a-asset-item id="bananaModel" src="assets/bananapelada.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

	<a-entity mindar-image-target="targetIndex: 0">
		  <a-gltf-model 
  		  src="#bananaModel" 
  		  position="0 0 0.1" 
 		   rotation="0 0 0" 
  		  scale="0.3 0.3 0.3"
  		  animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
 		  ></a-gltf-model>
		</a-entity>
    </a-scene>
  </body>
</html>
