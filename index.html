<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompostAR - versión AR.js</title>

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.2/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #info {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-family: sans-serif;
        padding: 8px 15px;
        border-radius: 10px;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <!-- Escena principal -->
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <!-- Cámara AR -->
      <a-marker preset="hiro">
        <!-- Esfera simple -->
        <a-sphere position="0 0.5 0" radius="0.25" color="#00FF7F"></a-sphere>

        <!-- Texto sobre compostaje -->
        <a-text
          value="¡CompostAR!\nReduce residuos y cuida el planeta 🌱"
          align="center"
          position="0 1 0"
          width="3"
          color="#FFFFFF"
        ></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <div id="info">
      Apunta con la cámara al marcador <b>Hiro</b> para ver el contenido AR.
      <br />
      (Podés imprimirlo desde:
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/three.js/examples/marker-training/examples/pattern-files/hiro.png" target="_blank" style="color:#90ee90;">aquí</a>)
    </div>
  </body>
</html>
